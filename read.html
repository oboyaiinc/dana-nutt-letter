<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The letter | Dana Nutt</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="styles.css">
  <style>
    .reader { padding: 1.2rem 0 2rem; }
    .reader iframe {
      width: 100%;
      height: min(90vh, 1100px);
      border: 1px solid #c9bba8;
      background: #fff;
    }
    .reader .btn { width: auto; min-width: 14rem; margin-top: 0.8rem; }
  </style>
</head>
<body>
  <div class="wrap reader">
    <header class="top">
      <strong>Dana Nutt</strong>
      <span>The letter</span>
    </header>
    <p class="kicker">A short letter from a fellow working man</p>
    <h1>What I’d do if I were 50+, still breaking my back every day, and retirement was nowhere in sight.</h1>
    <p><a class="btn" href="letter.pdf">Open the PDF</a></p>
    <p class="fine">If the preview below is blank, use Open the PDF. Same file either way.</p>
    <iframe src="letter.pdf" title="Dana Nutt letter"></iframe>
  </div>
</body>
</html>
